[package]
name = "prepmate-core"
version = "2.0.0-alpha.8"
edition = "2021"

[dependencies]
tao = "0.31"
wry = "0.48"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
rfd = "0.15"
lopdf = { version = "0.33", default-features = false, features = ["nom_parser"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
